<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Workout Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Tracker">
<meta name="theme-color" content="#17191b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17191b;
    --surface: #212427;
    --surface-raised: #292d30;
    --line: #383c3f;
    --steel: #6b7378;
    --text: #ecebe6;
    --text-dim: #9ca1a5;
    --tape: #f4c430;
    --tape-dim: #c9a328;
    --pink: #e8527a;
    --teal: #4fa8a0;
    --radius-s: 4px;
    --radius-m: 8px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #efece4;
      --surface: #ffffff;
      --surface-raised: #f7f5ef;
      --line: #ddd8cb;
      --steel: #74797d;
      --text: #1c1e1f;
      --text-dim: #6b6f72;
      --tape-dim: #b4890f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191b;
    --surface: #212427;
    --surface-raised: #292d30;
    --line: #383c3f;
    --text: #ecebe6;
    --text-dim: #9ca1a5;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .brand span { color: var(--tape); }
  .streak {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .streak b { color: var(--text); font-weight: 600; }

  .rotation-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .rot-pill {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: var(--radius-s);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    border: 1px solid var(--line);
    color: var(--text-dim);
    background: var(--surface);
    cursor: pointer;
  }
  .rot-pill.active {
    background: var(--tape);
    border-color: var(--tape);
    color: #1c1e1f;
  }

  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
  }
  .hero-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    margin: 0 0 8px;
  }

  .section-label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 22px 0 10px;
  }

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .ex-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    cursor: pointer;
  }
  .ex-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--steel);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ex-check svg { display: none; width: 12px; height: 12px; }
  .ex-card.done .ex-check {
    background: var(--teal);
    border-color: var(--teal);
  }
  .ex-card.done .ex-check svg { display: block; }
  .ex-card.done .ex-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--line); }

  .ex-name { font-weight: 600; font-size: 15px; flex: 1; }
  .ex-sub { font-size: 12px; color: var(--text-dim); }
  .chev { color: var(--text-dim); font-size: 12px; transition: transform .15s; }
  .ex-card.open .chev { transform: rotate(180deg); }

  .ex-body {
    display: none;
    padding: 0 14px 16px;
    border-top: 1px solid var(--line);
  }
  .ex-card.open .ex-body { display: block; }

  .last-time {
    font-size: 12px;
    color: var(--tape-dim);
    margin: 12px 0 10px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 1fr;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-row .set-num {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  .set-row input, .set-row select {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    padding: 9px 8px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--surface-raised);
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .set-row select.empty { color: var(--text-dim); }
  .set-row input:focus, .set-row select:focus {
    outline: none;
    border-color: var(--teal);
  }

  .add-set {
    background: none;
    border: 1px dashed var(--line);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: var(--radius-s);
    cursor: pointer;
    margin-top: 4px;
  }

  .notes {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    line-height: 1.4;
  }

  .finish-btn {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    border: none;
    border-radius: var(--radius-m);
    background: var(--tape);
    color: #1c1e1f;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .finish-btn:active { transform: scale(0.99); }
  .finish-btn.disabled { opacity: 0.4; pointer-events: none; }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius-m);
    font-size: 14px;
    opacity: 0;
    transition: all .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tool-row { display: flex; gap: 8px; margin-top: 18px; }
  .sync-btn { width: 100%; margin-top: 8px; }
  .sync-status { font-size: 12px; color: var(--text-dim); text-align: center; margin-top: 8px; min-height: 1em; }
  .tool-btn {
    flex: 1;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--surface);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .tool-btn:active { transform: scale(0.99); }
  .tool-btn[hidden], #historyView[hidden], #mainView[hidden] { display: none; }
  .hist-head { display: flex; gap: 8px; margin-bottom: 16px; }
  .hist-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 14px;
    margin-bottom: 12px;
  }
  .hist-date { font-size: 12px; color: var(--text-dim); }
  .hist-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 2px 0 10px;
  }
  .hist-row { padding: 8px 0; border-top: 1px solid var(--line); }
  .hist-ex { font-size: 14px; font-weight: 600; }
  .hist-detail { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .hist-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 40px 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">WORKOUT <span>TRACKER</span></div>
    <div class="streak">🔥 <b id="streakCount">0</b> Workouts Logged</div>
  </div>

  <div id="mainView">
  <div class="rotation-row" id="rotRow"></div>

  <div class="hero">
    <div class="hero-label" id="heroLabel">Today's Session</div>
    <div class="hero-title" id="heroTitle">Lower Body + Core</div>
  </div>

  <div id="exList"></div>

  <button class="finish-btn" id="finishBtn">Finish Workout</button>
  <div class="tool-row">
    <button class="tool-btn" id="historyBtn">History</button>
    <button class="tool-btn exportBtn">Export CSV</button>
  </div>
  <button class="tool-btn sync-btn" id="syncBtn">Google Sheet Sync</button>
  <div class="sync-status" id="syncStatus"></div>
  </div>

  <div id="historyView" hidden>
    <div class="hist-head">
      <button class="tool-btn" id="backBtn">&larr; Back</button>
      <button class="tool-btn exportBtn">Export CSV</button>
    </div>
    <div id="histList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  var WORKOUTS = {
    A: {
      title: "Lower Body + Core",
      sub: "Day A",
      exercises: [
        { id:'a1', name:'Elliptical Warm-Up', type:'cardio', sets:1, minutes:10, note:'10 Min, Easy Pace.' },
        { id:'a2', name:'Instinct Squat', type:'weight', sets:3, reps:10, note:'Nautilus Instinct Cable Station.' },
        { id:'a3', name:'Instinct Hip Glute Press', type:'weight', sets:3, reps:10, note:'Per Side.' },
        { id:'a4', name:'Leg Extension', type:'weight', sets:2, reps:12, note:'Technogym Machine.' },
        { id:'a5', name:'Leg Curl', type:'weight', sets:2, reps:12, note:'Technogym Machine.' },
        { id:'a6', name:'Core Crunch Machine', type:'weight', sets:2, reps:15, note:'' },
        { id:'a7', name:'Rower Finisher', type:'cardio', sets:1, minutes:10, note:'10 Min Steady Pace, Hydrow.' }
      ]
    },
    B: {
      title: "Upper Push",
      sub: "Day B",
      exercises: [
        { id:'b1', name:'Elliptical Warm-Up', type:'cardio', sets:1, minutes:10, note:'10 Min, Easy Pace.' },
        { id:'b2', name:'Technogym Chest Press', type:'weight', sets:3, reps:10, note:'' },
        { id:'b3', name:'Technogym Overhead Press', type:'weight', sets:3, reps:10, note:'' },
        { id:'b4', name:'Instinct Push Down', type:'weight', sets:2, reps:12, note:'' },
        { id:'b5', name:'DB Shoulder Raises', type:'weight', sets:2, reps:12, note:'Light Dumbbells, 5–8 Lb.' },
        { id:'b6', name:'Rower Finisher', type:'cardio', sets:1, minutes:10, note:'10 Min Steady Pace.' }
      ]
    },
    C: {
      title: "Upper Pull + Core",
      sub: "Day C",
      exercises: [
        { id:'c1', name:'Elliptical Warm-Up', type:'cardio', sets:1, minutes:10, note:'10 Min, Easy Pace.' },
        { id:'c2', name:'Instinct Pulldown', type:'weight', sets:3, reps:10, note:'' },
        { id:'c3', name:'Instinct High Row', type:'weight', sets:3, reps:10, note:'' },
        { id:'c4', name:'Instinct Biceps Curl', type:'weight', sets:2, reps:12, note:'' },
        { id:'c5', name:'Instinct Torso Twist', type:'weight', sets:2, reps:12, note:'Per Side.' },
        { id:'c6', name:'Ab Crunch (Instinct)', type:'weight', sets:2, reps:15, note:'' },
        { id:'c7', name:'Rowing Interval Finisher', type:'cardio', sets:1, minutes:10, note:'10 Min On The Rower, 1 Min Hard / 1 Min Easy.' }
      ]
    }
  };
  var ORDER = ['A','B','C'];

  var STORE_KEY = 'workoutTrackerData_v1';
  var LEGACY_STORE_KEY = 'threeRoundsData_v1';
  var state = loadState();

  function loadState(){
    try {
      // Fall back to the key used before the app was renamed so existing logs carry over.
      var raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(LEGACY_STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return { rotationIndex: 0, completedCount: 0, selectedDay: null, logs: {}, progress: {} };
  }
  // Persistence: everything lives in this device's localStorage.
  function saveState(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }

  if (state.selectedDay === null || state.selectedDay === undefined) {
    state.selectedDay = ORDER[state.rotationIndex % 3];
  }

  var rotRow = document.getElementById('rotRow');
  var exList = document.getElementById('exList');
  var heroTitle = document.getElementById('heroTitle');
  var streakCount = document.getElementById('streakCount');
  var finishBtn = document.getElementById('finishBtn');
  var toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  function renderRotation(){
    rotRow.innerHTML = '';
    ORDER.forEach(function(k){
      var pill = document.createElement('button');
      pill.className = 'rot-pill' + (state.selectedDay === k ? ' active' : '');
      pill.textContent = 'Day ' + k;
      pill.onclick = function(){
        state.selectedDay = k;
        saveState();
        renderAll();
      };
      rotRow.appendChild(pill);
    });
  }

  function getProgress(dayKey){
    if (!state.progress[dayKey]) state.progress[dayKey] = {};
    return state.progress[dayKey];
  }

  function renderHero(){
    var w = WORKOUTS[state.selectedDay];
    heroTitle.textContent = w.title;
    streakCount.textContent = state.completedCount;
  }

  var RPE_VALUES = [1, 2, 3, 4, 5, 6, 6.5, 7, 7.5, 8, 8.5, 9, 9.5, 10];

  function rpeSelect(value, onChange){
    var sel = document.createElement('select');
    var blank = document.createElement('option');
    blank.value = '';
    blank.textContent = 'RPE';
    sel.appendChild(blank);
    RPE_VALUES.forEach(function(v){
      var o = document.createElement('option');
      o.value = v;
      o.textContent = v;
      sel.appendChild(o);
    });
    sel.value = value || '';
    sel.className = sel.value ? '' : 'empty';
    sel.onchange = function(){
      sel.className = sel.value ? '' : 'empty';
      onChange(sel.value ? Number(sel.value) : '');
    };
    return sel;
  }

  function targetOf(ex){
    return { sets: ex.sets || '', reps: ex.reps || '', minutes: ex.minutes || '' };
  }

  function fmtSet(s){
    var t = s.weight ? (s.weight + ' kg \u00d7 ' + (s.reps || '?')) : (s.reps ? s.reps + ' Reps' : '');
    if (s.rpe) t += (t ? ' ' : '') + '@ RPE ' + s.rpe;
    return t;
  }
  function fmtCardio(e){
    var parts = [];
    if (e.minutes) parts.push(e.minutes + ' Min');
    if (e.distance) parts.push(e.distance + ' m');
    if (e.rpe) parts.push('RPE ' + e.rpe);
    return parts.join(' \u00b7 ');
  }

  // "Last time" skips workouts where the exercise was skipped or has no numbers.
  function lastEntry(exId, has){
    var log = state.logs[exId] || [];
    for (var i = log.length - 1; i >= 0; i--) if (has(log[i])) return log[i];
    return null;
  }
  function lastLogText(exId){
    var last = lastEntry(exId, function(e){ return e.sets && e.sets.length; });
    return last ? last.sets.map(fmtSet).filter(Boolean).join(', ') : null;
  }
  function lastCardioText(exId){
    var last = lastEntry(exId, function(e){ return e.minutes || e.distance || e.rpe; });
    return last ? fmtCardio(last) : null;
  }

  function renderExercises(){
    exList.innerHTML = '';
    var w = WORKOUTS[state.selectedDay];
    var prog = getProgress(state.selectedDay);

    var sectionAdded = false;
    w.exercises.forEach(function(ex){
      var card = document.createElement('div');
      card.className = 'ex-card';
      if (prog[ex.id] && prog[ex.id].done) card.className += ' done';

      var head = document.createElement('div');
      head.className = 'ex-head';

      var check = document.createElement('div');
      check.className = 'ex-check';
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#17191b" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
      check.onclick = function(e){
        e.stopPropagation();
        if (!prog[ex.id]) prog[ex.id] = {};
        prog[ex.id].done = !prog[ex.id].done;
        saveState();
        renderExercises();
        updateFinishState();
      };

      var nameWrap = document.createElement('div');
      nameWrap.style.flex = '1';
      var name = document.createElement('div');
      name.className = 'ex-name';
      name.textContent = ex.name;
      var sub = document.createElement('div');
      sub.className = 'ex-sub';
      sub.textContent = ex.type === 'cardio'
        ? (prog[ex.id] && prog[ex.id].minutes ? prog[ex.id].minutes + ' Min Logged' : 'Tap To Log Time')
        : (ex.sets + ' Sets × ' + ex.reps + ' Reps');
      nameWrap.appendChild(name);
      nameWrap.appendChild(sub);

      var chev = document.createElement('div');
      chev.className = 'chev';
      chev.textContent = '▾';

      head.appendChild(check);
      head.appendChild(nameWrap);
      head.appendChild(chev);
      head.onclick = function(){
        card.classList.toggle('open');
      };

      var body = document.createElement('div');
      body.className = 'ex-body';

      if (ex.type === 'weight') {
        var lastText = lastLogText(ex.id);
        if (lastText) {
          var lt = document.createElement('div');
          lt.className = 'last-time';
          lt.textContent = 'Last Time: ' + lastText;
          body.appendChild(lt);
        } else {
          var lt2 = document.createElement('div');
          lt2.className = 'last-time';
          lt2.textContent = 'No History Yet — Log Your First Set Below.';
          body.appendChild(lt2);
        }

        var setsWrap = document.createElement('div');
        var existing = (prog[ex.id] && prog[ex.id].sets) || [];
        var numSets = Math.max(ex.sets, existing.length || 0);

        function renderSetRows(){
          setsWrap.innerHTML = '';
          for (var i = 0; i < numSets; i++) {
            (function(i){
              var row = document.createElement('div');
              row.className = 'set-row';
              var num = document.createElement('div');
              num.className = 'set-num';
              num.textContent = (i+1);
              var wInput = document.createElement('input');
              wInput.type = 'number';
              wInput.inputMode = 'decimal';
              wInput.placeholder = 'kg';
              wInput.value = (existing[i] && existing[i].weight) || '';
              var rInput = document.createElement('input');
              rInput.type = 'number';
              rInput.inputMode = 'numeric';
              rInput.placeholder = 'Reps';
              rInput.value = (existing[i] && existing[i].reps) || '';
              var rpe = (existing[i] && existing[i].rpe) || '';
              var rpeInput = rpeSelect(rpe, function(v){ rpe = v; persist(); });

              function persist(){
                if (!prog[ex.id]) prog[ex.id] = {};
                if (!prog[ex.id].sets) prog[ex.id].sets = [];
                prog[ex.id].sets[i] = {
                  weight: wInput.value ? Number(wInput.value) : '',
                  reps: rInput.value ? Number(rInput.value) : '',
                  rpe: rpe
                };
                saveState();
              }
              wInput.oninput = persist;
              rInput.oninput = persist;

              row.appendChild(num);
              row.appendChild(wInput);
              row.appendChild(rInput);
              row.appendChild(rpeInput);
              setsWrap.appendChild(row);
            })(i);
          }
        }
        renderSetRows();

        var addBtn = document.createElement('button');
        addBtn.className = 'add-set';
        addBtn.textContent = '+ Add Set';
        addBtn.onclick = function(){
          numSets++;
          renderSetRows();
        };

        body.appendChild(setsWrap);
        body.appendChild(addBtn);
        body.appendChild(el('div', 'notes', 'RPE 10 = No Reps Left, 9 = 1 Left, 8 = 2 Left, 7 = 3 Left.'));
      }

      if (ex.type === 'cardio') {
        var lastCardio = lastCardioText(ex.id);
        var lc = document.createElement('div');
        lc.className = 'last-time';
        lc.textContent = lastCardio ? ('Last Time: ' + lastCardio) : 'No History Yet — Log Your Time Below.';
        body.appendChild(lc);

        var cardioRow = document.createElement('div');
        cardioRow.className = 'set-row';
        cardioRow.style.gridTemplateColumns = '1fr 1fr 1fr';

        function cardioInput(field, placeholder, mode){
          var inp = document.createElement('input');
          inp.type = 'number';
          inp.inputMode = mode;
          inp.placeholder = placeholder;
          inp.value = (prog[ex.id] && prog[ex.id][field]) || '';
          inp.oninput = function(){
            if (!prog[ex.id]) prog[ex.id] = {};
            prog[ex.id][field] = inp.value ? Number(inp.value) : '';
            saveState();
          };
          return inp;
        }

        cardioRow.appendChild(cardioInput('minutes', 'Min', 'numeric'));
        cardioRow.appendChild(cardioInput('distance', 'Meters', 'numeric'));
        cardioRow.appendChild(rpeSelect(prog[ex.id] && prog[ex.id].rpe, function(v){
          if (!prog[ex.id]) prog[ex.id] = {};
          prog[ex.id].rpe = v;
          saveState();
        }));
        body.appendChild(cardioRow);
        body.appendChild(el('div', 'notes', 'RPE 10 = All-Out, 7 = Hard But Steady, 5 = Easy.'));
      }

      if (ex.note) {
        var n = document.createElement('div');
        n.className = 'notes';
        n.textContent = ex.note;
        body.appendChild(n);
      }

      card.appendChild(head);
      card.appendChild(body);
      exList.appendChild(card);
    });
  }

  function updateFinishState(){
    // no-op gate for now; always allow finishing
  }

  function finishWorkout(){
    var w = WORKOUTS[state.selectedDay];
    var prog = getProgress(state.selectedDay);
    var now = new Date();
    var session = { start: now.getTime(), day: state.selectedDay, items: [] };

    var anything = w.exercises.some(function(ex){
      var p = prog[ex.id] || {};
      return p.done || p.minutes || p.distance || p.rpe ||
        (p.sets || []).some(function(st){ return st && (st.weight || st.reps || st.rpe); });
    });
    if (!anything && !confirm('Nothing Logged Yet. Finish Anyway? Every Exercise Will Be Marked Skipped.')) return;

    // Every exercise gets an entry: done (logged or checked off) or skipped, plus its targets.
    w.exercises.forEach(function(ex){
      var p = prog[ex.id] || {};
      var entry = { date: now.toISOString(), status: 'done', target: targetOf(ex) };
      if (ex.type === 'weight') {
        var filled = (p.sets || []).filter(function(st){ return st && (st.weight || st.reps || st.rpe); });
        if (filled.length) entry.sets = filled;
      } else {
        if (p.minutes) entry.minutes = p.minutes;
        if (p.distance) entry.distance = p.distance;
        if (p.rpe) entry.rpe = p.rpe;
      }
      if (!entry.sets && !entry.minutes && !entry.distance && !entry.rpe && !p.done) entry.status = 'skipped';
      if (!state.logs[ex.id]) state.logs[ex.id] = [];
      state.logs[ex.id].push(entry);
      session.items.push({ exId: ex.id, t: session.start, e: entry });
    });

    // Advance from the day actually finished (it may have been picked by hand), then clear the
    // checkmarks and entries on both that day and the next one so it starts fresh. Logs are kept.
    var finishedDay = state.selectedDay;
    state.completedCount += 1;
    state.rotationIndex = (ORDER.indexOf(finishedDay) + 1) % 3;
    state.selectedDay = ORDER[state.rotationIndex];
    state.progress[finishedDay] = {};
    state.progress[state.selectedDay] = {};

    saveState();
    showToast('Workout Logged. Next Up: Day ' + state.selectedDay);
    renderAll();
    window.scrollTo(0, 0);
    if (session.items.length) queueForSync([session]);
  }

  finishBtn.onclick = finishWorkout;

  // ---------- History + CSV export ----------
  var mainView = document.getElementById('mainView');
  var historyView = document.getElementById('historyView');
  var histList = document.getElementById('histList');
  var EXMAP = {};
  ORDER.forEach(function(k){
    WORKOUTS[k].exercises.forEach(function(ex, i){ EXMAP[ex.id] = { ex: ex, day: k, idx: i }; });
  });

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  // Entries logged within a few seconds of each other belong to the same workout.
  function buildSessions(){
    var entries = [];
    Object.keys(state.logs || {}).forEach(function(exId){
      (state.logs[exId] || []).forEach(function(e){
        entries.push({ exId: exId, t: new Date(e.date).getTime(), e: e });
      });
    });
    entries.sort(function(a, b){ return a.t - b.t; });
    var sessions = [];
    entries.forEach(function(en){
      var s = sessions[sessions.length - 1];
      if (!s || en.t - s.last > 5000) { s = { start: en.t, last: en.t, items: [] }; sessions.push(s); }
      s.last = en.t;
      s.items.push(en);
    });
    sessions.forEach(function(s){
      s.items.sort(function(a, b){
        var A = EXMAP[a.exId], B = EXMAP[b.exId];
        return (A ? A.idx : 99) - (B ? B.idx : 99);
      });
      var m = EXMAP[s.items[0].exId];
      s.day = m ? m.day : null;
    });
    return sessions;
  }

  function fmtSets(sets){
    return (sets || []).map(fmtSet).filter(Boolean).join('  \u00b7  ');
  }

  function renderHistory(){
    histList.innerHTML = '';
    var sessions = buildSessions().reverse();
    if (!sessions.length) {
      histList.appendChild(el('div', 'hist-empty', 'No Workouts Logged Yet. Finish A Workout And It Will Show Up Here.'));
      return;
    }
    sessions.forEach(function(s){
      var d = new Date(s.start);
      var card = el('div', 'hist-card');
      card.appendChild(el('div', 'hist-date',
        d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +
        ' \u00b7 ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })));
      card.appendChild(el('div', 'hist-title', s.day ? ('Day ' + s.day + ' \u2014 ' + WORKOUTS[s.day].title) : 'Workout'));
      s.items.forEach(function(it){
        var m = EXMAP[it.exId];
        var row = el('div', 'hist-row');
        row.appendChild(el('div', 'hist-ex', m ? m.ex.name : it.exId));
        var detail = it.e.status === 'skipped' ? 'Skipped' : (it.e.sets ? fmtSets(it.e.sets) : (fmtCardio(it.e) || 'Done'));
        if (detail) row.appendChild(el('div', 'hist-detail', detail));
        card.appendChild(row);
      });
      histList.appendChild(card);
    });
  }

  function csvCell(v){
    v = (v === null || v === undefined) ? '' : String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  var ROW_HEADERS = ['Date', 'Day', 'Exercise ID', 'Exercise', 'Status', 'Set', 'Target Sets', 'Target Reps', 'Target Minutes',
                     'Weight (kg)', 'Reps', 'RPE', 'Minutes', 'Distance (m)'];

  function sessionRows(s){
    var rows = [];
    var d = new Date(s.start);
    s.items.forEach(function(it){
      var m = EXMAP[it.exId];
      var e = it.e;
      var t = e.target || (m ? targetOf(m.ex) : { sets: '', reps: '', minutes: '' });
      var base = [ymd(d), s.day || '', it.exId, m ? m.ex.name : it.exId, e.status === 'skipped' ? 'Skipped' : 'Done'];
      var targets = [t.sets, t.reps, t.minutes];
      if (e.sets && e.sets.length) {
        e.sets.forEach(function(st, i){
          rows.push(base.concat([i + 1], targets, [st.weight, st.reps, st.rpe || '', '', '']));
        });
      } else {
        rows.push(base.concat([''], targets, ['', '', e.rpe || '', e.minutes || '', e.distance || '']));
      }
    });
    return rows;
  }

  function buildCsv(){
    var rows = [ROW_HEADERS];
    buildSessions().forEach(function(s){ rows = rows.concat(sessionRows(s)); });
    return '\uFEFF' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  }

  var exportBtns = document.querySelectorAll('.exportBtn');

  // Uses the iOS share sheet when available (Save to Files, AirDrop, Mail…), else a plain download.
  async function exportCsv(){
    if (!buildSessions().length) { showToast('Nothing To Export Yet'); return; }
    var filename = 'workout-tracker-' + ymd(new Date()) + '.csv';
    var blob = new Blob([buildCsv()], { type: 'text/csv' });
    try {
      var file = new File([blob], filename, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch(e){
      if (e && e.name === 'AbortError') return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  exportBtns.forEach(function(b){ b.onclick = exportCsv; });

  // ---------- Google Sheet sync ----------
  // Each finished workout is queued, then POSTed to a Google Apps Script web app that appends
  // it to the sheet. The queue survives being offline; the script skips session IDs it already has.
  var SYNC_KEY = 'workoutTrackerSync_v1';
  var sync = loadSync();
  var syncing = false;
  var syncBtn = document.getElementById('syncBtn');
  var syncStatus = document.getElementById('syncStatus');

  function loadSync(){
    try {
      var raw = localStorage.getItem(SYNC_KEY);
      if (raw) { var o = JSON.parse(raw); o.queue = o.queue || []; return o; }
    } catch(e){}
    return { url: '', key: '', queue: [], lastSync: null, keyRejected: false };
  }
  function saveSync(){
    try { localStorage.setItem(SYNC_KEY, JSON.stringify(sync)); } catch(e){}
    renderSyncStatus();
  }
  function renderSyncStatus(){
    if (!sync.url) { syncStatus.textContent = 'Not Connected'; return; }
    if (sync.keyRejected) { syncStatus.textContent = 'Sync Key Rejected. Tap Google Sheet Sync To Fix It'; return; }
    if (sync.queue.length) {
      syncStatus.textContent = sync.queue.length + (sync.queue.length === 1 ? ' Workout' : ' Workouts') + ' Waiting To Sync';
    } else if (sync.lastSync) {
      var d = new Date(sync.lastSync);
      syncStatus.textContent = 'Synced ' + d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) +
        ', ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
    } else {
      syncStatus.textContent = 'Connected';
    }
  }

  function queueForSync(sessions){
    var queued = {};
    sync.queue.forEach(function(q){ queued[q.sessionId] = true; });
    sessions.forEach(function(s){
      var id = 'ses-' + s.start;
      if (!queued[id]) sync.queue.push({ sessionId: id, rows: sessionRows(s) });
    });
    saveSync();
    flushSync(true);
  }

  async function flushSync(announce){
    if (!sync.url || !sync.queue.length || syncing) return;
    syncing = true;
    var sent = 0;
    try {
      while (sync.queue.length) {
        var item = sync.queue[0];
        // text/plain keeps this a "simple" request, so Apps Script doesn't need to answer a CORS preflight.
        var payload = { key: sync.key, sessionId: item.sessionId, rows: item.rows };
        var res = await fetch(sync.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) });
        var out = await res.json();
        if (out && out.error === 'Unauthorized') {
          sync.keyRejected = true;
          saveSync();
          if (announce) showToast('Sync Key Rejected');
          return;
        }
        if (!out || !out.ok) throw new Error((out && out.error) || 'Sync rejected');
        sync.queue.shift();
        sync.keyRejected = false;
        sync.lastSync = new Date().toISOString();
        saveSync();
        sent++;
      }
      if (announce && sent) showToast('Synced To Google Sheet');
    } catch(e){
      console.error('Sheet sync failed', e);
      if (announce) showToast('Saved. Will Sync When Online');
    } finally {
      syncing = false;
      renderSyncStatus();
    }
  }

  syncBtn.onclick = function(){
    var url = prompt('Paste Your Google Apps Script Web App URL (Leave Blank To Disconnect):', sync.url || '');
    if (url === null) return;
    url = url.trim();
    if (!url) { sync.url = ''; sync.key = ''; sync.keyRejected = false; saveSync(); showToast('Google Sheet Disconnected'); return; }
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      alert('That Doesn\'t Look Like An Apps Script Web App URL. It Should Start With https://script.google.com/ And End With /exec.');
      return;
    }
    var key = prompt('Paste Your Sync Key (From The setupSyncKey Step In Apps Script):', sync.key || '');
    if (key === null) return;
    key = key.trim();
    if (!key) { alert('A Sync Key Is Required So Only Your Phone Can Write To The Sheet.'); return; }
    sync.url = url;
    sync.key = key;
    sync.keyRejected = false;
    saveSync();
    var past = buildSessions();
    if (past.length && confirm('Send All ' + past.length + ' Past ' + (past.length === 1 ? 'Workout' : 'Workouts') + ' To The Sheet? Any Already There Are Skipped.')) {
      queueForSync(past);
    } else {
      showToast('Google Sheet Connected');
      flushSync(true);
    }
  };

  window.addEventListener('online', function(){ flushSync(true); });
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) flushSync(false); });
  renderSyncStatus();
  flushSync(false);

  document.getElementById('historyBtn').onclick = function(){
    mainView.hidden = true;
    historyView.hidden = false;
    renderHistory();
    window.scrollTo(0, 0);
  };
  document.getElementById('backBtn').onclick = function(){
    historyView.hidden = true;
    mainView.hidden = false;
    window.scrollTo(0, 0);
  };

  function renderAll(){
    renderRotation();
    renderHero();
    renderExercises();
    if (!historyView.hidden) renderHistory();
  }

  renderAll();

})();
</script>
</body>
</html>
