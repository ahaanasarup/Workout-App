<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Rounds</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3 Rounds">
<meta name="theme-color" content="#17191b">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #17191b;
    --surface: #212427;
    --surface-raised: #292d30;
    --line: #383c3f;
    --steel: #6b7378;
    --text: #ecebe6;
    --text-dim: #9ca1a5;
    --tape: #f4c430;
    --tape-dim: #c9a328;
    --pink: #e8527a;
    --teal: #4fa8a0;
    --radius-s: 4px;
    --radius-m: 8px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #efece4;
      --surface: #ffffff;
      --surface-raised: #f7f5ef;
      --line: #ddd8cb;
      --steel: #74797d;
      --text: #1c1e1f;
      --text-dim: #6b6f72;
      --tape-dim: #b4890f;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17191b;
    --surface: #212427;
    --surface-raised: #292d30;
    --line: #383c3f;
    --text: #ecebe6;
    --text-dim: #9ca1a5;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    max-width: 520px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }
  .topbar {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .brand {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
  }
  .brand span { color: var(--tape); }
  .streak {
    font-size: 13px;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .streak b { color: var(--text); font-weight: 600; }

  .rotation-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  .rot-pill {
    flex: 1;
    text-align: center;
    padding: 9px 4px;
    border-radius: var(--radius-s);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    border: 1px solid var(--line);
    color: var(--text-dim);
    background: var(--surface);
  }
  .rot-pill.active {
    background: var(--tape);
    border-color: var(--tape);
    color: #1c1e1f;
  }

  .hero {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 18px 18px 16px;
    margin-bottom: 16px;
  }
  .hero-label { font-size: 12px; color: var(--text-dim); margin-bottom: 2px; }
  .hero-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 30px;
    line-height: 1.05;
    margin: 0 0 8px;
  }
  .hero-meta { font-size: 13px; color: var(--text-dim); }

  .picker {
    display: flex;
    gap: 8px;
    margin-bottom: 18px;
  }
  .picker button {
    flex: 1;
    padding: 10px 6px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .picker button.sel {
    border-color: var(--tape);
    color: var(--text);
    background: var(--surface-raised);
  }

  .section-label {
    font-size: 12px;
    color: var(--text-dim);
    margin: 22px 0 10px;
  }

  .ex-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    margin-bottom: 10px;
    overflow: hidden;
  }
  .ex-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    cursor: pointer;
  }
  .ex-check {
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 2px solid var(--steel);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .ex-check svg { display: none; width: 12px; height: 12px; }
  .ex-card.done .ex-check {
    background: var(--teal);
    border-color: var(--teal);
  }
  .ex-card.done .ex-check svg { display: block; }
  .ex-card.done .ex-name { color: var(--text-dim); text-decoration: line-through; text-decoration-color: var(--line); }

  .ex-name { font-weight: 600; font-size: 15px; flex: 1; }
  .ex-sub { font-size: 12px; color: var(--text-dim); }
  .chev { color: var(--text-dim); font-size: 12px; transition: transform .15s; }
  .ex-card.open .chev { transform: rotate(180deg); }

  .ex-body {
    display: none;
    padding: 0 14px 16px;
    border-top: 1px solid var(--line);
  }
  .ex-card.open .ex-body { display: block; }

  .last-time {
    font-size: 12px;
    color: var(--tape-dim);
    margin: 12px 0 10px;
  }

  .set-row {
    display: grid;
    grid-template-columns: 28px 1fr 1fr 32px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .set-row .set-num {
    font-size: 12px;
    color: var(--text-dim);
    text-align: center;
  }
  .set-row input {
    width: 100%;
    padding: 9px 8px;
    border-radius: var(--radius-s);
    border: 1px solid var(--line);
    background: var(--surface-raised);
    color: var(--text);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
  }
  .set-row input:focus {
    outline: none;
    border-color: var(--teal);
  }
  .set-row .unit { font-size: 11px; color: var(--text-dim); text-align: center; }

  .add-set {
    background: none;
    border: 1px dashed var(--line);
    color: var(--text-dim);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: var(--radius-s);
    cursor: pointer;
    margin-top: 4px;
  }

  .notes {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 10px;
    line-height: 1.4;
  }

  .finish-btn {
    width: 100%;
    padding: 16px;
    margin-top: 24px;
    border: none;
    border-radius: var(--radius-m);
    background: var(--tape);
    color: #1c1e1f;
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 18px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .finish-btn:active { transform: scale(0.99); }
  .finish-btn.disabled { opacity: 0.4; pointer-events: none; }

  .reset-link {
    display: block;
    text-align: center;
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-dim);
    text-decoration: underline;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface-raised);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 20px;
    border-radius: var(--radius-m);
    font-size: 14px;
    opacity: 0;
    transition: all .25s ease;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .tool-row { display: flex; gap: 8px; margin-top: 18px; }
  .tool-btn {
    flex: 1;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    background: var(--surface);
    color: var(--text);
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .tool-btn:active { transform: scale(0.99); }
  .tool-btn[hidden], #historyView[hidden], #mainView[hidden] { display: none; }
  .hist-head { display: flex; gap: 8px; margin-bottom: 16px; }
  .hist-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius-m);
    padding: 14px;
    margin-bottom: 12px;
  }
  .hist-date { font-size: 12px; color: var(--text-dim); }
  .hist-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 2px 0 10px;
  }
  .hist-row { padding: 8px 0; border-top: 1px solid var(--line); }
  .hist-ex { font-size: 14px; font-weight: 600; }
  .hist-detail { font-size: 13px; color: var(--text-dim); margin-top: 2px; }
  .hist-empty { text-align: center; color: var(--text-dim); font-size: 14px; padding: 40px 16px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">THREE <span>ROUNDS</span></div>
    <div class="streak">🔥 <b id="streakCount">0</b> workouts logged</div>
  </div>

  <div id="mainView">
  <div class="rotation-row" id="rotRow"></div>

  <div class="hero">
    <div class="hero-label" id="heroLabel">Today's session</div>
    <div class="hero-title" id="heroTitle">Lower Body + Core</div>
    <div class="hero-meta" id="heroMeta">5 exercises · ~35 min</div>
  </div>

  <div class="picker" id="dayPicker"></div>

  <div id="exList"></div>

  <button class="finish-btn" id="finishBtn">Finish workout</button>
  <div class="tool-row">
    <button class="tool-btn" id="historyBtn">History</button>
    <button class="tool-btn exportBtn">Export CSV</button>
  </div>
  <span class="reset-link" id="resetLink">Reset all logged data</span>
  </div>

  <div id="historyView" hidden>
    <div class="hist-head">
      <button class="tool-btn" id="backBtn">&larr; Back</button>
      <button class="tool-btn exportBtn">Export CSV</button>
    </div>
    <div id="histList"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  var WORKOUTS = {
    A: {
      title: "Lower Body + Core",
      sub: "Day A",
      exercises: [
        { id:'a1', name:'Elliptical warm-up', type:'cardio', sets:1, note:'5 min, easy pace.' },
        { id:'a2', name:'Instinct Squat', type:'weight', sets:3, reps:10, note:'Nautilus Instinct cable station.' },
        { id:'a3', name:'Instinct Hip Glute Press', type:'weight', sets:3, reps:10, note:'Per side.' },
        { id:'a4', name:'Leg Extension', type:'weight', sets:2, reps:12, note:'Technogym machine.' },
        { id:'a5', name:'Leg Curl', type:'weight', sets:2, reps:12, note:'Technogym machine.' },
        { id:'a6', name:'Core Crunch machine', type:'weight', sets:2, reps:15, note:'' },
        { id:'a7', name:'Rower finisher', type:'cardio', sets:1, note:'10 min steady pace, Hydrow.' }
      ]
    },
    B: {
      title: "Upper Push",
      sub: "Day B",
      exercises: [
        { id:'b1', name:'Elliptical warm-up', type:'cardio', sets:1, note:'5 min, easy pace.' },
        { id:'b2', name:'Technogym Chest Press', type:'weight', sets:3, reps:10, note:'' },
        { id:'b3', name:'Technogym Overhead Press', type:'weight', sets:3, reps:10, note:'' },
        { id:'b4', name:'Instinct Push Down', type:'weight', sets:2, reps:12, note:'' },
        { id:'b5', name:'DB Shoulder Raises', type:'weight', sets:2, reps:12, note:'Light dumbbells, 5–8 lb.' },
        { id:'b6', name:'Rower finisher', type:'cardio', sets:1, note:'10 min steady pace.' }
      ]
    },
    C: {
      title: "Upper Pull + Core",
      sub: "Day C",
      exercises: [
        { id:'c1', name:'Elliptical warm-up', type:'cardio', sets:1, note:'5 min, easy pace.' },
        { id:'c2', name:'Instinct Pulldown', type:'weight', sets:3, reps:10, note:'' },
        { id:'c3', name:'Instinct High Row', type:'weight', sets:3, reps:10, note:'' },
        { id:'c4', name:'Instinct Biceps Curl', type:'weight', sets:2, reps:12, note:'' },
        { id:'c5', name:'Instinct Torso Twist', type:'weight', sets:2, reps:12, note:'Per side.' },
        { id:'c6', name:'Ab Crunch (Instinct)', type:'weight', sets:2, reps:15, note:'' },
        { id:'c7', name:'Interval finisher', type:'cardio', sets:1, note:'10 min, 1 min hard / 1 min easy — elliptical or rower.' }
      ]
    }
  };
  var ORDER = ['A','B','C'];

  var STORE_KEY = 'threeRoundsData_v1';
  var state = loadState();

  function loadState(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e){}
    return { rotationIndex: 0, completedCount: 0, selectedDay: null, logs: {}, progress: {} };
  }
  // Persistence: everything lives in this device's localStorage.
  function saveState(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch(e){}
  }

  if (state.selectedDay === null || state.selectedDay === undefined) {
    state.selectedDay = ORDER[state.rotationIndex % 3];
  }

  var rotRow = document.getElementById('rotRow');
  var dayPicker = document.getElementById('dayPicker');
  var exList = document.getElementById('exList');
  var heroTitle = document.getElementById('heroTitle');
  var heroMeta = document.getElementById('heroMeta');
  var streakCount = document.getElementById('streakCount');
  var finishBtn = document.getElementById('finishBtn');
  var toast = document.getElementById('toast');

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 1800);
  }

  function renderRotation(){
    rotRow.innerHTML = '';
    ORDER.forEach(function(k, i){
      var pill = document.createElement('div');
      pill.className = 'rot-pill' + (i === state.rotationIndex % 3 ? ' active' : '');
      pill.textContent = 'Day ' + k;
      rotRow.appendChild(pill);
    });
  }

  function renderPicker(){
    dayPicker.innerHTML = '';
    ORDER.forEach(function(k){
      var btn = document.createElement('button');
      btn.textContent = WORKOUTS[k].sub + ' · ' + WORKOUTS[k].title.split(' ')[0];
      btn.className = state.selectedDay === k ? 'sel' : '';
      btn.onclick = function(){
        state.selectedDay = k;
        saveState();
        renderAll();
      };
      dayPicker.appendChild(btn);
    });
  }

  function getProgress(dayKey){
    if (!state.progress[dayKey]) state.progress[dayKey] = {};
    return state.progress[dayKey];
  }

  function renderHero(){
    var w = WORKOUTS[state.selectedDay];
    heroTitle.textContent = w.title;
    heroMeta.textContent = w.exercises.length + ' exercises · ~35 min';
    streakCount.textContent = state.completedCount;
  }

  function lastLogText(exId){
    var log = state.logs[exId];
    if (!log || !log.length) return null;
    var last = log[log.length - 1];
    return last.sets.map(function(s){
      return s.weight ? (s.weight + ' kg × ' + (s.reps || '?')) : (s.reps ? s.reps + ' reps' : '');
    }).filter(Boolean).join(', ');
  }

  function lastCardioText(exId){
    var log = state.logs[exId];
    if (!log || !log.length) return null;
    var last = log[log.length - 1];
    return last.minutes ? (last.minutes + ' min') : null;
  }

  function renderExercises(){
    exList.innerHTML = '';
    var w = WORKOUTS[state.selectedDay];
    var prog = getProgress(state.selectedDay);

    var sectionAdded = false;
    w.exercises.forEach(function(ex){
      var card = document.createElement('div');
      card.className = 'ex-card';
      if (prog[ex.id] && prog[ex.id].done) card.className += ' done';

      var head = document.createElement('div');
      head.className = 'ex-head';

      var check = document.createElement('div');
      check.className = 'ex-check';
      check.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="#17191b" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>';
      check.onclick = function(e){
        e.stopPropagation();
        if (!prog[ex.id]) prog[ex.id] = {};
        prog[ex.id].done = !prog[ex.id].done;
        saveState();
        renderExercises();
        updateFinishState();
      };

      var nameWrap = document.createElement('div');
      nameWrap.style.flex = '1';
      var name = document.createElement('div');
      name.className = 'ex-name';
      name.textContent = ex.name;
      var sub = document.createElement('div');
      sub.className = 'ex-sub';
      sub.textContent = ex.type === 'cardio'
        ? (prog[ex.id] && prog[ex.id].minutes ? prog[ex.id].minutes + ' min logged' : 'Tap to log time')
        : (ex.sets + ' sets × ' + ex.reps + ' reps');
      nameWrap.appendChild(name);
      nameWrap.appendChild(sub);

      var chev = document.createElement('div');
      chev.className = 'chev';
      chev.textContent = '▾';

      head.appendChild(check);
      head.appendChild(nameWrap);
      head.appendChild(chev);
      head.onclick = function(){
        card.classList.toggle('open');
      };

      var body = document.createElement('div');
      body.className = 'ex-body';

      if (ex.type === 'weight') {
        var lastText = lastLogText(ex.id);
        if (lastText) {
          var lt = document.createElement('div');
          lt.className = 'last-time';
          lt.textContent = 'Last time: ' + lastText;
          body.appendChild(lt);
        } else {
          var lt2 = document.createElement('div');
          lt2.className = 'last-time';
          lt2.textContent = 'No history yet — log your first set below.';
          body.appendChild(lt2);
        }

        var setsWrap = document.createElement('div');
        var existing = (prog[ex.id] && prog[ex.id].sets) || [];
        var numSets = Math.max(ex.sets, existing.length || 0);

        function renderSetRows(){
          setsWrap.innerHTML = '';
          for (var i = 0; i < numSets; i++) {
            (function(i){
              var row = document.createElement('div');
              row.className = 'set-row';
              var num = document.createElement('div');
              num.className = 'set-num';
              num.textContent = (i+1);
              var wInput = document.createElement('input');
              wInput.type = 'number';
              wInput.inputMode = 'decimal';
              wInput.placeholder = 'kg';
              wInput.value = (existing[i] && existing[i].weight) || '';
              var rInput = document.createElement('input');
              rInput.type = 'number';
              rInput.inputMode = 'numeric';
              rInput.placeholder = 'reps';
              rInput.value = (existing[i] && existing[i].reps) || '';
              var unit = document.createElement('div');
              unit.className = 'unit';
              unit.textContent = '';

              function persist(){
                if (!prog[ex.id]) prog[ex.id] = {};
                if (!prog[ex.id].sets) prog[ex.id].sets = [];
                prog[ex.id].sets[i] = {
                  weight: wInput.value ? Number(wInput.value) : '',
                  reps: rInput.value ? Number(rInput.value) : ''
                };
                saveState();
              }
              wInput.oninput = persist;
              rInput.oninput = persist;

              row.appendChild(num);
              row.appendChild(wInput);
              row.appendChild(rInput);
              row.appendChild(unit);
              setsWrap.appendChild(row);
            })(i);
          }
        }
        renderSetRows();

        var addBtn = document.createElement('button');
        addBtn.className = 'add-set';
        addBtn.textContent = '+ Add set';
        addBtn.onclick = function(){
          numSets++;
          renderSetRows();
        };

        body.appendChild(setsWrap);
        body.appendChild(addBtn);
      }

      if (ex.type === 'cardio') {
        var lastCardio = lastCardioText(ex.id);
        var lc = document.createElement('div');
        lc.className = 'last-time';
        lc.textContent = lastCardio ? ('Last time: ' + lastCardio) : 'No history yet — log your time below.';
        body.appendChild(lc);

        var cardioRow = document.createElement('div');
        cardioRow.className = 'set-row';
        cardioRow.style.gridTemplateColumns = '1fr 70px 1fr';

        var cLabel = document.createElement('div');
        cLabel.className = 'ex-sub';
        cLabel.style.alignSelf = 'center';
        cLabel.textContent = 'Duration';

        var mInput = document.createElement('input');
        mInput.type = 'number';
        mInput.inputMode = 'numeric';
        mInput.placeholder = 'min';
        mInput.value = (prog[ex.id] && prog[ex.id].minutes) || '';
        mInput.oninput = function(){
          if (!prog[ex.id]) prog[ex.id] = {};
          prog[ex.id].minutes = mInput.value ? Number(mInput.value) : '';
          saveState();
        };

        var spacer = document.createElement('div');

        cardioRow.appendChild(cLabel);
        cardioRow.appendChild(mInput);
        cardioRow.appendChild(spacer);
        body.appendChild(cardioRow);
      }

      if (ex.note) {
        var n = document.createElement('div');
        n.className = 'notes';
        n.textContent = ex.note;
        body.appendChild(n);
      }

      card.appendChild(head);
      card.appendChild(body);
      exList.appendChild(card);
    });
  }

  function updateFinishState(){
    // no-op gate for now; always allow finishing
  }

  function finishWorkout(){
    var w = WORKOUTS[state.selectedDay];
    var prog = getProgress(state.selectedDay);

    // push any logged sets into history
    w.exercises.forEach(function(ex){
      if (ex.type === 'weight' && prog[ex.id] && prog[ex.id].sets) {
        var filled = prog[ex.id].sets.filter(function(s){ return s.weight || s.reps; });
        if (filled.length) {
          if (!state.logs[ex.id]) state.logs[ex.id] = [];
          state.logs[ex.id].push({ date: new Date().toISOString(), sets: filled });
        }
      }
      if (ex.type === 'cardio' && prog[ex.id] && prog[ex.id].minutes) {
        if (!state.logs[ex.id]) state.logs[ex.id] = [];
        state.logs[ex.id].push({ date: new Date().toISOString(), minutes: prog[ex.id].minutes });
      }
    });

    state.completedCount += 1;
    state.rotationIndex = (state.rotationIndex + 1) % 3;
    state.selectedDay = ORDER[state.rotationIndex];
    state.progress[Object.keys(WORKOUTS).find(function(k){return true;})]; // noop
    // clear today's checkmarks/sets for the day just done, keep logs
    state.progress[ORDER[(state.rotationIndex + 2) % 3]] = {};

    saveState();
    showToast('Workout logged. Next up: Day ' + state.selectedDay);
    renderAll();
  }

  finishBtn.onclick = finishWorkout;

  document.getElementById('resetLink').onclick = function(){
    if (confirm('Clear all logged workouts and history? This can\'t be undone.')) {
      state = { rotationIndex: 0, completedCount: 0, selectedDay: 'A', logs: {}, progress: {} };
      saveState();
      renderAll();
      showToast('All data cleared');
    }
  };

  // ---------- History + CSV export ----------
  var mainView = document.getElementById('mainView');
  var historyView = document.getElementById('historyView');
  var histList = document.getElementById('histList');
  var EXMAP = {};
  ORDER.forEach(function(k){
    WORKOUTS[k].exercises.forEach(function(ex, i){ EXMAP[ex.id] = { ex: ex, day: k, idx: i }; });
  });

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  }
  function pad(n){ return n < 10 ? '0' + n : '' + n; }
  function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function hm(d){ return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  // Entries logged within a few seconds of each other belong to the same workout.
  function buildSessions(){
    var entries = [];
    Object.keys(state.logs || {}).forEach(function(exId){
      (state.logs[exId] || []).forEach(function(e){
        entries.push({ exId: exId, t: new Date(e.date).getTime(), e: e });
      });
    });
    entries.sort(function(a, b){ return a.t - b.t; });
    var sessions = [];
    entries.forEach(function(en){
      var s = sessions[sessions.length - 1];
      if (!s || en.t - s.last > 5000) { s = { start: en.t, last: en.t, items: [] }; sessions.push(s); }
      s.last = en.t;
      s.items.push(en);
    });
    sessions.forEach(function(s){
      s.items.sort(function(a, b){
        var A = EXMAP[a.exId], B = EXMAP[b.exId];
        return (A ? A.idx : 99) - (B ? B.idx : 99);
      });
      var m = EXMAP[s.items[0].exId];
      s.day = m ? m.day : null;
    });
    return sessions;
  }

  function fmtSets(sets){
    return (sets || []).map(function(s){
      return s.weight ? (s.weight + ' kg \u00d7 ' + (s.reps || '?')) : (s.reps ? s.reps + ' reps' : '');
    }).filter(Boolean).join('  \u00b7  ');
  }

  function renderHistory(){
    histList.innerHTML = '';
    var sessions = buildSessions().reverse();
    if (!sessions.length) {
      histList.appendChild(el('div', 'hist-empty', 'No workouts logged yet. Finish a workout and it will show up here.'));
      return;
    }
    sessions.forEach(function(s){
      var d = new Date(s.start);
      var card = el('div', 'hist-card');
      card.appendChild(el('div', 'hist-date',
        d.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) +
        ' \u00b7 ' + d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' })));
      card.appendChild(el('div', 'hist-title', s.day ? ('Day ' + s.day + ' \u2014 ' + WORKOUTS[s.day].title) : 'Workout'));
      s.items.forEach(function(it){
        var m = EXMAP[it.exId];
        var row = el('div', 'hist-row');
        row.appendChild(el('div', 'hist-ex', m ? m.ex.name : it.exId));
        var detail = it.e.sets ? fmtSets(it.e.sets) : (it.e.minutes ? it.e.minutes + ' min' : '');
        if (detail) row.appendChild(el('div', 'hist-detail', detail));
        card.appendChild(row);
      });
      histList.appendChild(card);
    });
  }

  function csvCell(v){
    v = (v === null || v === undefined) ? '' : String(v);
    return /[",\n\r]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
  }
  function buildCsv(){
    var rows = [['Date', 'Time', 'Day', 'Workout', 'Exercise', 'Type', 'Set', 'Weight (kg)', 'Reps', 'Minutes']];
    buildSessions().forEach(function(s){
      var d = new Date(s.start);
      var title = s.day ? WORKOUTS[s.day].title : '';
      s.items.forEach(function(it){
        var m = EXMAP[it.exId];
        var name = m ? m.ex.name : it.exId;
        if (it.e.sets) {
          it.e.sets.forEach(function(st, i){
            rows.push([ymd(d), hm(d), s.day || '', title, name, 'weight', i + 1, st.weight, st.reps, '']);
          });
        } else {
          rows.push([ymd(d), hm(d), s.day || '', title, name, 'cardio', '', '', '', it.e.minutes]);
        }
      });
    });
    return '\uFEFF' + rows.map(function(r){ return r.map(csvCell).join(','); }).join('\r\n');
  }

  var exportBtns = document.querySelectorAll('.exportBtn');

  // Uses the iOS share sheet when available (Save to Files, AirDrop, Mail…), else a plain download.
  async function exportCsv(){
    if (!buildSessions().length) { showToast('Nothing to export yet'); return; }
    var filename = 'three-rounds-' + ymd(new Date()) + '.csv';
    var blob = new Blob([buildCsv()], { type: 'text/csv' });
    try {
      var file = new File([blob], filename, { type: 'text/csv' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: filename });
        return;
      }
    } catch(e){
      if (e && e.name === 'AbortError') return;
    }
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  exportBtns.forEach(function(b){ b.onclick = exportCsv; });

  document.getElementById('historyBtn').onclick = function(){
    mainView.hidden = true;
    historyView.hidden = false;
    renderHistory();
    window.scrollTo(0, 0);
  };
  document.getElementById('backBtn').onclick = function(){
    historyView.hidden = true;
    mainView.hidden = false;
    window.scrollTo(0, 0);
  };

  function renderAll(){
    renderRotation();
    renderPicker();
    renderHero();
    renderExercises();
    if (!historyView.hidden) renderHistory();
  }

  renderAll();

})();
</script>
</body>
</html>
